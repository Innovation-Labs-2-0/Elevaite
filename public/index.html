<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InnovAIte | Hackathon Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Custom Styles (All CSS is kept here) -->
    <style>
      /* All CSS from your original file goes here */
      body {
        font-family: "Inter", sans-serif;
        background: linear-gradient(180deg, white 0%, #f3f8fe 100%);
      }
      .nav-link {
        cursor: pointer;
        padding: 0.5rem 1rem;
        border-radius: 0.375rem;
        transition: all 0.3s ease;
        position: relative;
        color: #4b5563;
      }
      .nav-link:hover {
        color: #1b5287;
      }
      .nav-link.active {
        background-color: #1b5287;
        color: white;
        box-shadow: 0 4px 14px 0 rgba(27, 82, 135, 0.3);
      }
      .page {
        display: none;
      }
      .page.active {
        display: block;
        animation: pageFadeIn 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }
      @keyframes pageFadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      /* ... (Include all other structural and visual CSS here) ... */
      .card {
        background-color: white;
        border-radius: 1rem;
        padding: 1.5rem;
        box-shadow: 0 4px 15px rgba(27, 82, 135, 0.08);
        transition: transform 0.3s, box-shadow 0.3s;
      }
      .main-title {
        background: linear-gradient(45deg, #1b5287, #2563eb);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .btn-primary {
        background: linear-gradient(45deg, #1b5287, #2563eb);
        color: white;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body class="text-gray-800">
    <div id="announcement-banner"></div>

    <header
      class="bg-white/80 backdrop-blur-md shadow-sm sticky top-0 z-40 border-b border-gray-200"
    >
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center py-2">
          <div class="flex items-center gap-4">
            <img
              src="https://storage.googleapis.com/gemini-prod/images/InnovAIte%40Jade-color-Logo-03.jpg"
              alt="InnovAIte Logo"
              class="h-12"
            />
            <p
              id="current-datetime"
              class="font-semibold hidden lg:block text-xs text-gray-500"
            ></p>
          </div>
          <div class="flex items-center gap-4">
            <nav
              class="flex items-center space-x-1 md:space-x-2 text-sm md:text-base font-medium"
              id="main-nav-links"
            >
              <!-- Navigation links will be populated by JS -->
            </nav>
            <div id="user-menu" class="relative">
              <button
                id="user-menu-button"
                class="flex items-center gap-2 p-2 rounded-full hover:bg-gray-100 transition-colors"
              >
                <span
                  class="w-8 h-8 rounded-full bg-[#1B5287] text-white flex items-center justify-center font-bold text-sm"
                  id="user-avatar"
                ></span>
                <span
                  class="hidden md:block text-sm font-medium"
                  id="user-menu-name"
                ></span>
                <svg
                  class="w-4 h-4 text-gray-500"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M19 9l-7 7-7-7"
                  ></path>
                </svg>
              </button>
              <div id="user-menu-dropdown"></div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto py-10 sm:px-6 lg:px-8">
      <div id="loading-spinner"><div class="spinner"></div></div>
      <div
        id="notification-banner"
        class="hidden fixed top-20 right-5 py-3 px-5 rounded-lg shadow-lg z-50 transform translate-x-full"
      ></div>
      <div id="home-page" class="page"></div>
      <div id="my-hub-page" class="page"></div>
      <div id="ideathon-page" class="page"></div>
      <div id="hackathon-page" class="page"></div>
      <div id="admin-page" class="page"></div>
    </main>

    <div id="modal-container" class="modal-backdrop"></div>

    <!-- LINK TO EXTERNAL JAVASCRIPT FILE -->
    <script type="module" src="./app.js"></script>
  </body>
</html>
